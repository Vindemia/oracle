<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f6" />
    <meta name="description" content="Oracle — gestion des priorités, matrice d'Eisenhower." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Oracle" />
    <title>Oracle</title>
    <script>
      // Pose data-theme avant le premier paint pour éviter un flash du
      // mauvais thème — ThemeProvider prendra le relais une fois monté
      // (et appliquera la préférence serveur si elle diffère).
      (function () {
        try {
          var stored = window.localStorage.getItem('oracle:themeId');
          document.documentElement.dataset.theme = stored || 'neutral';
        } catch (e) {
          document.documentElement.dataset.theme = 'neutral';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

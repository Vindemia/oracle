server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api {
        proxy_pass http://server:4300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Fichiers hashés par Vite (assets/*.js, *.css…) : un changement de contenu
    # change le nom de fichier, donc cache immuable sans risque.
    location ~* \.(js|css|woff2?|png|svg|jpg|jpeg|webp)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html et le service worker pilotent les mises à jour de la PWA :
    # jamais de cache navigateur, sinon le SW ne voit jamais la nouvelle version.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}

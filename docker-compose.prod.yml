services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oracle
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: oracle
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oracle"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: ${DOCKER_REGISTRY}/oracle-server:${TAG}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${PORT:-4300}
      DATABASE_URL: postgresql://oracle:${DB_PASSWORD}@db:5432/oracle
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      SMTP_URL: ${SMTP_URL}
      MAIL_FROM: ${MAIL_FROM}
    networks:
      - default
      - proxynet

  client:
    image: ${DOCKER_REGISTRY}/oracle-client:${TAG}
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - default
      - proxynet

  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: oracle
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: oracle
      PGHOST: db
      BACKUP_KEEP: 14
      BACKUP_HOUR: 3
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      RCLONE_KEEP: ${RCLONE_KEEP:-30}
    volumes:
      - backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]

volumes:
  db_data:
  backups:

networks:
  default: {}
  proxynet:
    external: true

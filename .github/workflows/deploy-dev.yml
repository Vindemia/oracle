name: Deploy Dev

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    name: Build & Push images (dev)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/oracle-server:dev
            ghcr.io/${{ steps.owner.outputs.value }}/oracle-server:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push client
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/client/Dockerfile
          target: production
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.DEV_VITE_API_URL }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/oracle-client:dev
            ghcr.io/${{ steps.owner.outputs.value }}/oracle-client:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to dev server
    runs-on: ubuntu-latest
    needs: build-push
    environment: development

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Copy compose file & scripts vers le serveur
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "docker-compose.prod.yml,scripts/backup.sh"
          target: "oracle-dev"
          strip_components: 0
          overwrite: true

      # Réécrit le .env du serveur à chaque déploiement à partir des secrets
      # de l'environnement GitHub `development` — cf. deploy-prod.yml pour le
      # détail du heredoc quoté.
      - name: Écrire le .env sur le serveur
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 1m
          timeout: 30s
          script: |
            set -e
            umask 077
            cat > $HOME/oracle-dev/.env <<'ENVEOF'
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
            PORT=${{ secrets.PORT }}
            CLIENT_PORT=${{ secrets.CLIENT_PORT }}
            VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
            VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
            VAPID_SUBJECT=${{ secrets.VAPID_SUBJECT }}
            SMTP_URL=${{ secrets.SMTP_URL }}
            MAIL_FROM=${{ secrets.MAIL_FROM }}
            GITHUB_FEEDBACK_TOKEN=${{ secrets.FEEDBACK_GITHUB_TOKEN }}
            GITHUB_FEEDBACK_REPO=${{ secrets.FEEDBACK_GITHUB_REPO }}
            RCLONE_REMOTE=${{ secrets.RCLONE_REMOTE }}
            RCLONE_KEEP=${{ secrets.RCLONE_KEEP }}
            ENVEOF
            chmod 600 $HOME/oracle-dev/.env

      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 5m
          timeout: 30s
          script: |
            set -e
            cd $HOME/oracle-dev
            export TAG=dev
            export DOCKER_REGISTRY=ghcr.io/${{ steps.owner.outputs.value }}
            docker compose -f $HOME/oracle-dev/docker-compose.prod.yml pull
            docker compose -f $HOME/oracle-dev/docker-compose.prod.yml up -d

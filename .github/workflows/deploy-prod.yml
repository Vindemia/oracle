name: Deploy Production

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-push:
    name: Build & Push images (${{ github.ref_name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set lowercase owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/oracle-server:latest
            ghcr.io/${{ steps.owner.outputs.value }}/oracle-server:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push client
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/client/Dockerfile
          target: production
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.PROD_VITE_API_URL }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/oracle-client:latest
            ghcr.io/${{ steps.owner.outputs.value }}/oracle-client:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production server
    runs-on: ubuntu-latest
    needs: build-push
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set short sha
        id: sha
        run: echo "value=$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Copy compose file & scripts vers le serveur
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "docker-compose.prod.yml,scripts/backup.sh"
          target: "oracle"
          strip_components: 0
          overwrite: true

      # Réécrit le .env du serveur à chaque déploiement à partir des secrets
      # de l'environnement GitHub `production` — élimine la dérive entre le
      # .env maintenu à la main sur le serveur et les variables réellement
      # attendues par docker-compose.prod.yml (cf. incident VAPID #42).
      # Heredoc quoté ('ENVEOF') : les secrets sont interpolés par GitHub
      # Actions AVANT l'envoi du script sur le serveur — le heredoc quoté
      # empêche toute réinterprétation shell de leur contenu (ex: `$`, `` ` ``).
      - name: Écrire le .env sur le serveur
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 1m
          timeout: 30s
          script: |
            set -e
            umask 077
            cat > $HOME/oracle/.env <<'ENVEOF'
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
            PORT=${{ secrets.PORT }}
            CLIENT_PORT=${{ secrets.CLIENT_PORT }}
            VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
            VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
            VAPID_SUBJECT=${{ secrets.VAPID_SUBJECT }}
            SMTP_URL=${{ secrets.SMTP_URL }}
            MAIL_FROM=${{ secrets.MAIL_FROM }}
            GITHUB_FEEDBACK_TOKEN=${{ secrets.GITHUB_FEEDBACK_TOKEN }}
            GITHUB_FEEDBACK_REPO=${{ secrets.GITHUB_FEEDBACK_REPO }}
            RCLONE_REMOTE=${{ secrets.RCLONE_REMOTE }}
            RCLONE_KEEP=${{ secrets.RCLONE_KEEP }}
            ENVEOF
            chmod 600 $HOME/oracle/.env

      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 5m
          timeout: 30s
          script: |
            set -e
            cd $HOME/oracle

            # Filet pré-migration : dump ponctuel de la db avant que le
            # conteneur server ne lance `prisma migrate deploy` au (re)démarrage.
            # Non bloquant : si db-backup n'existe pas encore (premier déploiement
            # après l'ajout de ce service) ou échoue, on log et on continue —
            # les dumps quotidiens réguliers restent le filet principal.
            docker compose -f docker-compose.prod.yml exec -T -e BACKUP_NAME=pre-deploy-${{ steps.sha.outputs.value }} db-backup sh /backup.sh once \
              && echo "[deploy] dump pré-migration OK: pre-deploy-${{ steps.sha.outputs.value }}.dump" \
              || echo "[deploy] ATTENTION: dump pré-migration impossible (service db-backup absent ou erreur), poursuite du déploiement"

            export TAG=${{ github.ref_name }}
            export DOCKER_REGISTRY=ghcr.io/${{ steps.owner.outputs.value }}
            docker compose -f $HOME/oracle/docker-compose.prod.yml pull
            docker compose -f $HOME/oracle/docker-compose.prod.yml up -d
